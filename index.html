
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wave - Твоя соцсеть</title>
<style>
  :root { --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa; --accent: #8b5cf6; --border: #27272a; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  header .logo { color: var(--accent); }
  .stories { display: flex; gap: 14px; padding: 16px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .story-ring { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(45deg, var(--accent), #ec4899, #f59e0b); padding: 3px; display: flex; align-items: center; justify-content: center; }
  .story-avatar { width: 100%; height: 100%; border-radius: 50%; background: var(--card); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
  .story span { font-size: 11px; color: var(--muted); }
  .feed { padding: 12px; display: flex; flex-direction: column; gap: 16px; }
  .post { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--border); animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #3b82f6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
  .post-head .name { font-size: 14px; font-weight: 600; }
  .post-head .time { font-size: 12px; color: var(--muted); }
  .post-img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--border); display: flex; align-items: center; justify-content: center; }
  .post-img img { width: 100%; height: 100%; object-fit: cover; }
  .post-actions { display: flex; gap: 20px; padding: 14px 14px 8px; }
  .post-actions button { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0; transition: transform 0.15s; }
  .post-actions button:active { transform: scale(1.25); }
  .post-actions button.liked { color: #f43f5e; }
  .post-caption { padding: 6px 14px 16px; font-size: 14px; line-height: 1.4; }
  .post-caption .likes { font-weight: 600; margin-bottom: 4px; display: block; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  nav button { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 6px 20px; transition: color 0.15s; }
  nav button.active { color: var(--accent); }
  .plus-btn { transform: scale(1.1); color: var(--text) !important; background: var(--card); border-radius: 12px; }
  .profile { display: none; padding: 20px 16px; }
  .profile.active { display: block; }
  .feed.hidden, .stories.hidden { display: none; }
  .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .profile-top .avatar { width: 80px; height: 80px; font-size: 30px; }
  .profile-stats { display: flex; gap: 24px; }
  .profile-stats div { text-align: center; }
  .profile-stats b { display: block; font-size: 18px; }
  .profile-stats span { font-size: 12px; color: var(--muted); }
  .profile-bio { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 16px; }
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; align-items: flex-end; }
  .modal.active { display: flex; }
  .modal-content { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 20px; animation: slideUpModal 0.3s ease-out; }
  @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 18px; }
  .modal-header button { background: none; border: none; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; }
  .modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-size: 15px; resize: none; font-family: inherit; margin-bottom: 16px; }
  .modal textarea:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<header><h1><span class="logo">◆</span> wave</h1><span style="font-size:22px">🔔</span></header>
<div class="stories" id="stories">
  <div class="story"><div class="story-ring"><div class="story-avatar" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6)">A</div></div><span>alex_design</span></div>
  <div class="story"><div class="story-ring"><div class="story-avatar" style="background: linear-gradient(135deg, #ec4899, #f43f5e)">M</div></div><span>maria.codes</span></div>
  <div class="story"><div class="story-ring"><div class="story-avatar" style="background: linear-gradient(135deg, #f59e0b, #f97316)">D</div></div><span>dev_ivan</span></div>
</div>
<main class="feed" id="feed"></main>
<section class="profile" id="profile">
  <div class="profile-top"><div class="avatar">U</div><div class="profile-stats"><div><b>1</b><span>постов</span></div><div><b>12</b><span>подписчиков</span></div><div><b>8</b><span>подписок</span></div></div></div>
  <p class="profile-bio"><b>Ваше имя</b><br>Создаю новый интерфейс соцсети 🚀</p>
</section>
<div class="modal" id="createModal">
  <div class="modal-content">
    <div class="modal-header"><h2>Новый пост</h2><button onclick="closeModal()">Отмена</button></div>
    <input type="text" id="imageLink" placeholder="Вставьте ссылку на картинку (https://...)" style="width:100%; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:12px; color:#fff; margin-bottom:16px;">
    <textarea id="postText" rows="3" placeholder="Что нового?"></textarea>
    <button onclick="createPost()" style="width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600;">Опубликовать</button>
  </div>
</div>
<nav>
  <button class="active" onclick="switchTab('feed', this)">🏠</button>
  <button class="plus-btn" onclick="openModal()">➕</button>
  <button onclick="switchTab('profile', this)">👤</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://aizsrqbzcnytvhtshwdq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpenNycWJ6Y255dHZodHNod2RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyODYzNzMsImV4cCI6MjExMDg2MjM3M30.th-H-6TUN18k5eZ5YGVqej-7PMHWxyM_qO1K-Tf3dtk';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const feed = document.getElementById('feed');

  function toggleLike(btn) { btn.classList.toggle('liked'); btn.textContent = btn.classList.contains('liked') ? '♥' : '♡'; }
  
  function switchTab(tab, btn) {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active')); btn.classList.add('active');
    const feed = document.getElementById('feed'); const stories = document.getElementById('stories'); const profile = document.getElementById('profile');
    if (tab === 'feed') { feed.classList.remove('hidden'); stories.classList.remove('hidden'); profile.classList.remove('active'); }
    else { feed.classList.add('hidden'); stories.classList.add('hidden'); profile.classList.add('active'); }
  }

  function openModal() { document.getElementById('createModal').classList.add('active'); }
  function closeModal() { 
    document.getElementById('createModal').classList.remove('active'); 
    document.getElementById('imageLink').value = '';
    document.getElementById('postText').value = ''; 
  }

  async function createPost() {
    const linkInput = document.getElementById('imageLink').value;
    const text = document.getElementById('postText').value;
    let imageUrl = linkInput || "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1000&auto=format&fit=crop";

    try {
      const { data, error } = await supabaseClient.from('feed').insert([{ image_url: imageUrl, caption: text }]);
      if (error) throw error;
      alert("Пост сохранен в облаке!");
      closeModal(); 
      loadPosts(); 
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (error) {
      alert("Ошибка: " + error.message);
      console.error(error);
    }
  }

  async function loadPosts() {
    const { data: posts, error } = await supabaseClient.from('feed').select('*').order('created_at', { ascending: false });
    if (error) { console.error('Ошибка загрузки:', error); return; }
    feed.innerHTML = ''; 
    posts.forEach(post => {
      const newPost = document.createElement('article');
      newPost.className = 'post';
      newPost.innerHTML = `
        <div class="post-head"><div class="avatar">U</div><div><div class="name">Вы</div><div class="time">${new Date(post.created_at).toLocaleString('ru-RU')}</div></div></div>
        <div class="post-img"><img src="${post.image_url}" alt="Пост"></div>
        <div class="post-actions"><button onclick="toggleLike(this)">♡</button><button>💬</button><button>↗</button></div>
        <div class="post-caption"><span class="likes">0 отметок «Нравится»</span>${post.caption || 'Без описания'}</div>
      `;
      feed.appendChild(newPost);
    });
  }

  document.querySelectorAll('.story').forEach(story => {
    story.addEventListener('click', function() {
      const name = this.querySelector('span').textContent;
      const avatarText = this.querySelector('.story-avatar').textContent;
      const bgColor = this.querySelector('.story-avatar').style.background;
      const viewer = document.createElement('div');
      viewer.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; cursor: pointer;`;
      viewer.innerHTML = `<div style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 1000;"><div style="width: 40px; height: 40px; border-radius: 50%; background: ${bgColor}; display: flex; align-items: center; justify-content: center; font-weight: bold;">${avatarText}</div><span style="font-weight: 600;">${name}</span></div><div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.3);"><div style="width: 100%; height: 100%; background: #fff; animation: storyProgress 5s linear forwards;"></div></div><div style="width: 100%; height: 100%; background: ${bgColor}; display: flex; align-items: center; justify-content: center; font-size: 30px; text-align: center; padding: 20px;">Это история пользователя ${name} 👋</div><style>@keyframes storyProgress { from { width: 0%; } to { width: 100%; } }</style>`;
      document.body.appendChild(viewer);
      setTimeout(() => { if(document.body.contains(viewer)) viewer.remove(); }, 5000);
      viewer.addEventListener('click', () => viewer.remove());
    });
  });

  window.onload = loadPosts;
</script>
</body>
</html>
